{# Inline SVG icons (stroke-based, currentColor). Usage: {% from "partials/icons.html" import icon %}{{ icon("clock") }} #}
{% macro icon(name, size=24, cls="icon") -%}
<svg class="{{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "clock" -%}
<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "week" -%}
<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 13h2M11 13h2M15 13h2M7 17h2M11 17h2"/>
{%- elif name == "chart" -%}
<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>
{%- elif name == "calendar" -%}
<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>
{%- elif name == "menu" -%}
<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>
{%- elif name == "list" -%}
<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>
{%- elif name == "grid" -%}
<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
{%- elif name == "file" -%}
<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>
{%- elif name == "upload" -%}
<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
{%- elif name == "pen" -%}
<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
{%- elif name == "settings" -%}
<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>
{%- elif name == "chevron-right" -%}
<path d="M9 6l6 6-6 6"/>
{%- elif name == "chevron-left" -%}
<path d="M15 6l-6 6 6 6"/>
{%- elif name == "plus" -%}
<path d="M12 5v14M5 12h14"/>
{%- elif name == "play" -%}
<path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/>
{%- elif name == "pause" -%}
<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/>
{%- elif name == "stop" -%}
<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/>
{%- elif name == "info" -%}
<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
{%- elif name == "alert" -%}
<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>
{%- elif name == "check" -%}
<path d="M20 6L9 17l-5-5"/>
{%- elif name == "x" -%}
<path d="M18 6L6 18M6 6l12 12"/>
{%- elif name == "wifi-off" -%}
<path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5.2-2.8M19 13a10 10 0 0 0-2.1-1.6M2 8.8a15 15 0 0 1 4.2-2.7M22 8.8A15 15 0 0 0 11 5M12 20h.01"/>
{%- else -%}
<circle cx="12" cy="12" r="9"/>
{%- endif -%}
</svg>
{%- endmacro %}
