# Amtliche Ferientermine Bayern – mitgelieferter Ferienkatalog (app/services/ferien_catalog.py).
#
# Die App übernimmt diese Termine automatisch, wenn ein Schuljahr angelegt wird, das der Katalog vollständig
# abdeckt (Bundesland BY). Ferien, die über eine Periodengrenze reichen (Sommerferien beginnen teils vor dem
# 01.08.), werden auf die Periode zugeschnitten. Die übernommenen Termine lassen sich in der App bearbeiten.
#
# Eigene/aktualisierte Datei: Umgebungsvariable FERIEN_CATALOG_FILE auf eine Datei gleichen Formats setzen
# (z. B. /data/ferien_bayern.yaml im Container-Volume).
#
# Format je Block: school_year (Gliederung wie in der Quelle), name, kind (FerienKind: herbst, weihnachten,
# winter, ostern, pfingsten, sommer), start, end (erster und letzter Ferientag, beide einschließlich),
# official (Wortlaut der Tabellenzeile in der Quelle).
#
# Gliederung: Wie in BayMBl. 2022 Nr. 747 stehen die Sommerferien, mit denen ein Schuljahr beginnt, in diesem
# Schuljahr (z. B. 2026/27 beginnt mit „Sommerferien 2026“). Die App ordnet Ferien nach Datum der Periode zu;
# school_year dient nur der Gliederung und Prüfung.
#
# Buß- und Bettag: steht NICHT als Ferienblock in dieser Datei. BayMBl. 2022 Nr. 747 führt ihn nicht auf (kein
# Unterricht nach Art. 4 Nr. 3 Feiertagsgesetz); der ICS-Feed des Ministeriums nennt ihn als „unterrichtsfreier
# Tag“ (19.11.2025, 18.11.2026, 17.11.2027, 22.11.2028, 21.11.2029). Die App berechnet ihn bereits selbst als
# unterrichtsfreien Tag mit vollem Soll (app/core/calendar.py: buss_und_bettag) – Lehrkräfte sind an diesem Tag
# nicht vom Dienst befreit (z. B. pädagogischer Tag möglich).
#
# Abgleich: Alle Termine stimmen mit dem ICS-Feed des Ministeriums überein (km.bayern.de/ferientermine-herunterladen,
# DTEND dort exklusiv). Gegenprobe mit schulferien.org: alle dort genannten Termine identisch; die Sommerferien
# führt schulferien.org beim vorangehenden Schuljahr (andere Gliederung, gleiche Daten), Sommerferien 2024 sowie
# Herbst- und Weihnachtsferien 2024/25 fehlen dort. Es gilt jeweils der amtliche Wert.
#
# Nicht enthalten: Osterferien/Pfingstferien 2024 (Schuljahr 2023/24, nicht Teil der Ferienordnung 2024/25–2029/30).
# 2030/31 ist unvollständig: Bisher ist nur der Termin der Sommerferien 2030 festgelegt.
# Berufsschulen dürfen um bis zu 2 Tage abweichen (Nr. 1.2), Heimschulen auf Antrag um bis zu 6 weitere Tage (Nr. 1.3).

bundesland: BY
source_url: "https://www.verkuendung-bayern.de/baymbl/2022-747/"
source_title: "BayMBl. 2022 Nr. 747: Ferienordnung und schulfreie Samstage für die Schuljahre 2024/2025 bis 2029/2030 (Bekanntmachung des StMUK vom 7. Dezember 2022, Az. IV.7-BS4407/521/59)"
source_short: "Bayerisches Kultusministerium"
source_page: "https://www.km.bayern.de/termine/ferien-und-feiertage"
retrieved: 2026-10-30
note: "Amtliche Termine des Bayerischen Kultusministeriums; vor Gebrauch nicht verändert"
# Schuljahre, für die noch nicht alle Ferien festgelegt sind (werden nicht automatisch übernommen).
partial_school_years: ["2030/31"]

